# RTM Review_01, Review_02
# The review bot's rubric (WorkflowRunners_17, ReviewBot_17.8, DevelopmentSplit_21;
# development/PIPELINE.md, rule 10). One checkbox in the pull request's "Agent review" section per
# item: first the items every Aptix repository's rubric shares, in their shared order, selected by
# `shared_items`, with Iris-Slide's own text added to their guidance under [shared_guidance]; then
# Iris-Slide's own item (DependenciesThroughVcpkg). The bot loads this file, the files it names and
# .github/CODEOWNERS from the default branch's commit that .github/workflows/review.yml checks out,
# and the shared items, the family's general rules and the plan files from its own checkout, so a
# pull request cannot change the rules it is judged by.
#
# An item passes, fails, or does not apply. A failed item with blocking = true fails the
# `code-review` check; a failed advisory item is reported only. Changing this file changes what
# every later pull request is held to: it is a code-owner file (.github/CODEOWNERS), and its own
# pull request says why.

[review]
product = "Iris-Slide, the open-source decoder and encoder of Iris slide files (C++20, with Python and JavaScript bindings)"
# This repository's own documents, sent whole; a missing one fails the review by name. With the
# bot's instructions and the items they are one prompt-cached prefix, resent unchanged until the
# default branch changes one of them.
reference_files = [
    "development/ARCHITECTURE.md",
    "development/README.md",
    "development/PIPELINE.md",
    "CONTRIBUTING.md",
]
# The family's general conventions (style, CI runners, planning, what a public repository may
# carry), kept privately and named here by file name; the bot reads them from its own checkout.
shared_reference_files = ["style_guide.md", "ci_runners.md", "planning.md", "public_repositories.md"]
# The shared items that apply to Iris-Slide, in the shared order.
shared_items = [
    "Traceability",
    "StyleGuide",
    "MinimumSurface",
    "TestsFirst",
    "AbiAndConsumers",
    "PublicRepository",
    "SecurityImpact",
    "Pipeline",
    "DataProtection",
    "Documentation",
    "ClinicalIntegrity",
    "AgentDisclosure",
]
# The work items and requirement rows are kept privately; the bot reads them from its own checkout,
# by file name, and sends only the items and rows the pull request names (`PascalCase_n` IDs, as
# the plans write them).
plan_excerpt_files = ["WBS.md", "RTM.md"]

[shared_guidance]
Traceability = """
Iris-Slide's work items are `PascalCaseName_<number>` (`DecodeSafety_3`,
`JpegSizedFromHeader_3.1`) and its requirement rows `PascalCaseArea_<nn>`
(`Decode_01`). The description's WBS and RTM sections name them; their ticks
and rows are kept privately and link commits of
`https://github.com/Aptix-Bio/Iris-Slide`. Code carries `// RTM <ID>` (C++) or
`# RTM <ID>` (Python, CMake, workflows), and a Catch2 test the tag `[<ID>]`.
"""
StyleGuide = """
Iris-Slide's own rules are in CONTRIBUTING.md. The common failures here: a
TurboJPEG, libavif, OpenSlide or libdicom handle without an RAII owner; an
exception crossing `IrisSlideCore.hpp`, a thread entry or the Python or
JavaScript binding; a `Result` from a public call carrying other than
`Iris::Domain::IRIS_SLIDE` with an `IrisSlide::SlideError` code, apart from a
failure IFE reported, which keeps IFE's domain and code (ARCHITECTURE.md D12);
a walk over a DICOM sequence by recursion; a shared type other than
`<Name>_t` behind its `std::shared_ptr` alias, made by
`create_<name>(const <Name>Desc&, <Name>&)`.
"""
MinimumSurface = """
A block's layout is written only through IFE's `Builder` and read only through
its `Parser` (ARCHITECTURE.md D1).
"""
TestsFirst = """
Slides used by tests are built inside the test (RTM Testing_03).
"""
AbiAndConsumers = """
Iris-Slide consumes Iris-Headers and the Iris File Extension (IFE) through the
vcpkg overlay ports ports/iris-headers and ports/iris-file-extension, each
pinned to one commit and its archive's SHA-512. Its consumers use the headers
installed under include/Iris, the exported symbols, the `IrisSlide::` CMake
targets and install paths, and the Python package (the `Iris` module and its
type stubs). A change that changes the public headers has a paired branch of
the same name in Iris-Headers, merged first (CONTRIBUTING.md).
"""
PublicRepository = """
The licensed codec may be named only as a component that its licensees load at
run time (ARCHITECTURE.md D5). The review workflow
(.github/workflows/review.yml) and its configuration test name the review bot's
repository, which the workflow checks out. The plans and the family's general
conventions are referred to only as kept privately.
"""
SecurityImpact = """
Untrusted input here is an .iris file, a JPEG or AVIF stream, a DICOM series, an
OpenSlide source, and the byte ranges the WASM module fetches; a decode sizes
its destination from the stream's own header and compares it with the size the
file declares (ARCHITECTURE.md D3). A dependency is pinned through vcpkg
(PIPELINE.md rules 1-4).
"""
Pipeline = """
Runner labels are Blacksmith's; a `run:` step is at most MAX_RUN_LINES (2) lines
(PIPELINE.md rule 9; tools/workflow_lint.py). A job that needs a setting checks
it with cmake/require_settings.cmake. cmake/check_review_configuration.cmake
holds the review workflow's properties (PIPELINE.md rule 10).
"""
DataProtection = """
A test builds the slide it needs (RTM Testing_03).
"""
Documentation = """
A decision that changed is recorded in ARCHITECTURE.md §1. A change to how
Iris-Slide writes or reads an IFE block edits that block's row in
ARCHITECTURE.md §3 in the same commit (D6).
"""
ClinicalIntegrity = """
A decode compares the size its stream's header gives with TILE_LENGTH, or the
associated image's or annotation's declared size (ARCHITECTURE.md D3). Patient
identity is written only in the clinical stream (D2); attributes are written as
`METADATA_I2S` and identify no individual (D2, D8); a `DigitalImageIdentifier`
whose `DII_is_PHI` flag is true or absent is scrambled on de-identification
(D8).
"""

[trace]
# Every new WBS tick, and every RTM row moved to these statuses, links to the GitHub commit that
# did the work; a line that does not fails `item`. Checked by the bot itself, without the model.
# The WBS and RTM are kept privately, so the bot reads them by file name from its own checkout;
# no file of this repository holds ticks or rows.
item = "Traceability"
ticks = []
rows = []
row_statuses = ["Implemented", "Verified"]
plan_ticks = ["WBS.md"]
plan_rows = ["RTM.md"]

[verification]
# While the maintainer is the only developer, the pull request's author may give the final
# human verification.
allow_author = true

[[item]]
id = "DependenciesThroughVcpkg"
title = "Dependencies through vcpkg: no FetchContent or ExternalProject; every dependency from `vcpkg.json`, pinned"
blocking = true
guidance = """
PIPELINE.md rules 1-4. No FetchContent, ExternalProject, `file(DOWNLOAD)` or
`git clone` of a library in a CMake file or a script. Every library Iris-Slide
builds against, first-party or third-party, comes from vcpkg.json and is found
with `find_package(<package> CONFIG REQUIRED)`. A third-party library is pinned
by its version (an override in vcpkg.json) at the vcpkg commit named by
`builtin-baseline`, or by an overlay port under ports/ that fetches one commit's
archive and checks its SHA-512; a first-party repository is an overlay port
pinned the same way. A pin that moves updates PIPELINE.md's Pins table with its
source and the date it was read. scripts/bootstrap_vcpkg.cmake and
scripts/bootstrap_emsdk.cmake, which fetch vcpkg and the Emscripten SDK each at
a pinned commit, are the tools that provide the dependencies, and they pass.
Not applicable when the diff touches no build file, port, triplet or manifest.
"""
