name: Iris Slide Linux CMake CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Drafts run nothing (ci_runners: a runner runs only where a result is wanted).
    if: github.event.pull_request.draft != true
    strategy: 
      fail-fast: false

      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        build_type: [Release]
        c_compiler: [clang, gcc]
      
        include:
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            name: ubuntu
            arch: aarch64
          - os: ubuntu-24.04-arm
            name: ubuntu
            arch: amd64
    uses: ./.github/workflows/build-linux.yml
    with: 
      os: ${{ matrix.os }}
      c_compiler: ${{ matrix.c_compiler }}
      cpp_compiler: ${{ matrix.cpp_compiler }}
      build_type: ${{ matrix.build_type }}
      artifact: ${{ matrix.name }}-${{ matrix.arch }}-${{ matrix.c_compiler }}
      iris_cmake_flags: >
        -D IRIS_BUILD_PYTHON=ON
      


      