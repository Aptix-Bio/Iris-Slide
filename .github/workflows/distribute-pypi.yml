# VcpkgCaching_2 (OneReusableBuild_2.5; RTM Build_03): the Python source distribution and wheels of a
# published release, published to PyPI. cibuildwheel builds every Python version of a platform in
# one job (pyproject.toml, [tool.cibuildwheel]), the dependencies through vcpkg once per job.
name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  sdist:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # setuptools-scm reads the tag
      - run: pipx run build==1.6.1 --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: blacksmith-4vcpu-ubuntu-2404, name: linux-x86_64 }
          - { runner: blacksmith-4vcpu-ubuntu-2404-arm, name: linux-aarch64 }
          - { runner: blacksmith-4vcpu-windows-2025, name: windows-x86_64 }
          - { runner: blacksmith-6vcpu-macos-15, name: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: pipx run cibuildwheel==4.3.5 --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [sdist, wheels]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: distribute pypi
      url: https://pypi.org/project/Iris-Slide/
    permissions:
      id-token: write   # PyPI's trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
