# VcpkgCaching_2 (OneReusableBuild_2.5; RTM Build_03): a published release's archives, one call of
# _build.yml per platform, reading main's cache store and writing nothing to it. The archives'
# checks (architecture, first run) are ArtifactsChecked_17.4.
name: release archives

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: blacksmith-4vcpu-ubuntu-2404, artifact: ubuntu-x86_64 }
          - { runner: blacksmith-4vcpu-ubuntu-2404-arm, artifact: ubuntu-aarch64 }
    uses: ./.github/workflows/_build.yml
    with:
      runner: ${{ matrix.runner }}
      preset: ci
      cc: clang
      cxx: clang++
      access: read
      artifact: ${{ matrix.artifact }}

  javascript:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      source: javascript
      preset: wasm
      access: read
      artifact: javascript

  windows:
    needs: linux
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    with:
      runner: blacksmith-4vcpu-windows-2025
      preset: ci
      cc: cl
      cxx: cl
      access: read
      artifact: windows-x86_64

  macos:
    needs: linux
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    with:
      runner: blacksmith-6vcpu-macos-15
      preset: ci
      access: read
      artifact: macos-arm64

  upload:
    needs: [linux, javascript, windows, macos]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write   # the release's assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/*.tar.gz --repo "$GITHUB_REPOSITORY"
