name: Iris Slide macOS CMake CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Drafts run nothing (ci_runners: a runner runs only where a result is wanted).
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      
      matrix:
        os: [macos-latest]
        build_type: [Release]
        include:
          - os: macos-latest
            name: macos
            arch: arm64

    uses: ./.github/workflows/build-macos.yml
    with:
      os: ${{ matrix.os }}
      build_type: ${{ matrix.build_type }}
      artifact: ${{ matrix.name }}-${{ matrix.arch }}
      iris_cmake_flags: >
        -D IRIS_BUILD_PYTHON=ON
