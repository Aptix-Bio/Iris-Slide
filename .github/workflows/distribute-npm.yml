# VcpkgCaching_2 (OneReusableBuild_2.5; RTM Build_03): the JavaScript module of a published release,
# built by _build.yml and published to npm.
name: npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  javascript:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
      source: javascript
      preset: wasm
      access: read
      artifact: javascript

  publish:
    needs: javascript
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: javascript
          path: javascript
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: cmake -E tar xf iris-slide-javascript.tar.gz
      # npm reads the version from the tag; a leading v is dropped (semver.clean).
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "$TAG" --no-git-tag-version
      - run: npm install
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
